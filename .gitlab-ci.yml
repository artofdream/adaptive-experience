# CI for the Adaptive Experience Architecture docs repository.
# - coherence-guard (blocking): parse canonical xlsx and match docs counts (7/23+17/40).
# - markdownlint / linkcheck (advisory): quality signals, non-blocking.

stages:
  - verify
  - lint

coherence-guard:
  stage: verify
  image: python:3.12-alpine
  script:
    - sh scripts/check-coherence.sh
  rules:
    - changes:
        - "docs/**/*"
        - "implementations/**/*"
        - "archive/**/*.xlsx"
        - "archive/**/*.csv"
        - "scripts/check-coherence.sh"
        - "scripts/check_coherence.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

topic-schema-guard:
  stage: verify
  image: python:3.12-alpine
  script:
    - python scripts/check_topic_schemas.py
  rules:
    - changes:
        - "docs/04-technical-architecture/topic-contracts.md"
        - "docs/04-technical-architecture/schemas/**/*"
        - "scripts/check_topic_schemas.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

markdownlint:
  stage: lint
  image: node:20-alpine
  allow_failure: true
  script:
    - npm install -g markdownlint-cli2
    - markdownlint-cli2 "**/*.md" "#node_modules"
  rules:
    - changes:
        - "**/*.md"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

linkcheck:
  stage: lint
  image: node:20-alpine
  allow_failure: true
  script:
    - npm install -g markdown-link-check
    - >
      find . -name '*.md' -not -path './node_modules/*' -print0
      | xargs -0 -n1 markdown-link-check -q -c .mlc.json
  rules:
    - changes:
        - "**/*.md"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
