# CI for the Adaptive Experience Architecture docs repository.
# - coherence-guard (blocking): parse canonical xlsx and match docs counts (7/23+17/40).
# - markdownlint / linkcheck (advisory): quality signals, non-blocking.

stages:
  - report
  - verify
  - integration
  - lint
  - deploy

coherence-guard:
  stage: verify
  image: python:3.12-alpine
  script:
    - sh scripts/check-coherence.sh
  rules:
    - changes:
        - "docs/**/*"
        - "implementations/**/*"
        - "archive/**/*.xlsx"
        - "archive/**/*.csv"
        - "scripts/check-coherence.sh"
        - "scripts/check_coherence.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

topic-schema-guard:
  stage: verify
  image: python:3.12-alpine
  script:
    - python scripts/check_topic_schemas.py
    - python scripts/test_topic_schema_guard.py
  rules:
    - changes:
        - "docs/04-technical-architecture/topic-contracts.md"
        - "docs/04-technical-architecture/schemas/**/*"
        - "scripts/check_topic_schemas.py"
        - "scripts/test_topic_schema_guard.py"
        - "scripts/write_mvp_topic_schemas.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stakeholder-skill-sync:
  stage: verify
  image: python:3.12-alpine
  script:
    - python scripts/generate_codex_stakeholder_skills.py --check
  rules:
    - changes:
        - ".cursor/skills/**/*"
        - ".agents/skills/**/*"
        - ".claude/skills/**/*"
        - ".github/instructions/**/*"
        - ".github/copilot-instructions.md"
        - ".cursor/rules/stakeholder-skills-sync-sop.mdc"
        - "scripts/generate_codex_stakeholder_skills.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

traceability-guard:
  stage: verify
  image: python:3.12-alpine
  allow_failure: true  # advisory until a first clean run confirms no pre-existing gaps
  script:
    - python scripts/generate_requirement_evidence.py --check
    - python scripts/check_requirement_evidence.py
    - python scripts/test_requirement_evidence.py -v
    - python scripts/check_traceability.py
  rules:
    - changes:
        - "docs/02-business-analysis/requirements.md"
        - "docs/07-roadmap/roadmap.md"
        - "scripts/check_traceability.py"
        - "scripts/generate_requirement_evidence.py"
        - "scripts/check_requirement_evidence.py"
        - "scripts/test_requirement_evidence.py"
        - "docs/06-adr/**/*"
        - "docs/08-traceability/**/*"
        - "platform/**/*"
        - "edge/**/*"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

daily-brief-generate:
  stage: report
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git git-lfs
  script:
    - python scripts/generate_daily_brief.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

daily-brief-freshness:
  stage: verify
  image: python:3.12-alpine
  script:
    - python scripts/check_daily_brief_freshness.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

platform-foundation-unit:
  stage: verify
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s platform/tests -v
  rules:
    - changes:
        - "platform/**/*"
        - "docs/04-technical-architecture/schemas/**/*"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

edge-perimeter-unit:
  stage: verify
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s edge/tests -v
  rules:
    - changes:
        - "edge/**/*"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

platform-foundation-integration:
  stage: integration
  image: python:3.12
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: apache/kafka:3.9.1
      alias: kafka
      variables:
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: "broker,controller"
        KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
        # The combined broker/controller reaches its own controller listener
        # inside the service container; the job still reaches the broker via
        # the external `kafka:9092` service alias.
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  variables:
    POSTGRES_DB: adaptive_experience
    POSTGRES_USER: aea_migration
    POSTGRES_PASSWORD: ci-migration-only
    AEA_POSTGRES_DSN: postgresql://aea_migration:ci-migration-only@postgres:5432/adaptive_experience
    AEA_KAFKA_BOOTSTRAP: kafka:9092
  before_script:
    - pip install -r platform/requirements.txt
  script:
    - python platform/scripts/wait_for_services.py
    - python platform/scripts/apply_migrations.py
    - python platform/scripts/apply_migrations.py
    - python platform/scripts/provision_kafka.py
    - AEA_INTEGRATION=1 python -m unittest discover -s platform/tests -v
    - python platform/scripts/diagnose.py
  rules:
    - changes:
        - "platform/**/*"
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

markdownlint:
  stage: lint
  image: node:20-alpine
  allow_failure: true
  script:
    - npm install -g markdownlint-cli2
    - markdownlint-cli2 "**/*.md" "#node_modules"
  rules:
    - changes:
        - "**/*.md"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

linkcheck:
  stage: lint
  image: node:20-alpine
  allow_failure: true
  script:
    - npm install -g markdown-link-check
    - >
      find . -name '*.md' -not -path './node_modules/*' -print0
      | xargs -0 -n1 markdown-link-check -q -c .mlc.json
  rules:
    - changes:
        - "**/*.md"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Path B: cloud images only. OIDC role trusts main. Do not push to pilot ECR from a laptop.
# Alpine aws-cli is musl Python; --upgrade expat so pyexpat symbols resolve (#204).
.aws_oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_DEFAULT_REGION: us-east-1
    FF_NETWORK_PER_BUILD: "true"

build-ecr:
  extends: .aws_oidc
  stage: deploy
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  timeout: 45m
  resource_group: path-b-ecs
  before_script:
    - apk add --no-cache --upgrade aws-cli expat
    - aws --version
    - mkdir -p /tmp
    - printf '%s' "$GITLAB_OIDC_TOKEN" > /tmp/web-identity-token
    - chmod 0400 /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_ROLE_SESSION_NAME="gitlab-${CI_PIPELINE_ID}"
    - export AWS_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
    - test -n "${AWS_ROLE_ARN:-}"
    - test -n "${AEA_ECR_ORCHESTRATION:-}"
    - test -n "${AEA_ECR_BFF:-}"
    - test -n "${AEA_ECR_GATEWAY:-}"
  script:
    - REGISTRY=$(printf '%s' "$AEA_ECR_GATEWAY" | cut -d/ -f1)
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
    - docker build -f platform/Dockerfile.orchestration -t "$AEA_ECR_ORCHESTRATION:$CI_COMMIT_SHA" -t "$AEA_ECR_ORCHESTRATION:latest" .
    - docker build -f edge/bff/Dockerfile -t "$AEA_ECR_BFF:$CI_COMMIT_SHA" -t "$AEA_ECR_BFF:latest" edge
    - docker build -f edge/gateway/Dockerfile -t "$AEA_ECR_GATEWAY:$CI_COMMIT_SHA" -t "$AEA_ECR_GATEWAY:latest" edge/gateway
    - docker push "$AEA_ECR_ORCHESTRATION:$CI_COMMIT_SHA"
    - docker push "$AEA_ECR_ORCHESTRATION:latest"
    - docker push "$AEA_ECR_BFF:$CI_COMMIT_SHA"
    - docker push "$AEA_ECR_BFF:latest"
    - docker push "$AEA_ECR_GATEWAY:$CI_COMMIT_SHA"
    - docker push "$AEA_ECR_GATEWAY:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - platform/**/*
        - edge/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

deploy-ecs:
  extends: .aws_oidc
  stage: deploy
  image: python:3.12-alpine
  needs:
    - job: build-ecr
  timeout: 30m
  resource_group: path-b-ecs
  before_script:
    - apk add --no-cache --upgrade aws-cli expat curl
    - aws --version
    - mkdir -p /tmp
    - printf '%s' "$GITLAB_OIDC_TOKEN" > /tmp/web-identity-token
    - chmod 0400 /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_ROLE_SESSION_NAME="gitlab-${CI_PIPELINE_ID}"
    - export AWS_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
    - test -n "${AWS_ROLE_ARN:-}"
    - test -n "${AEA_ECR_ORCHESTRATION:-}"
    - test -n "${AEA_ECR_BFF:-}"
    - test -n "${AEA_ECR_GATEWAY:-}"
    - test -n "${AEA_ECS_CLUSTER:-}"
    - test -n "${AEA_PUBLIC_URL:-}"
  script:
    - |
      for svc in orchestration bff gateway relay consumer-workspace; do
        aws ecs update-service --cluster "$AEA_ECS_CLUSTER" --service "$svc" --force-new-deployment --query service.serviceName --output text
      done
    - aws ecs wait services-stable --cluster "$AEA_ECS_CLUSTER" --services gateway bff
    - curl -fsS --retry 20 --retry-delay 15 --retry-all-errors "${AEA_PUBLIC_URL}/healthz"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - platform/**/*
        - edge/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
