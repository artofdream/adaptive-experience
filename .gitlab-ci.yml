# CI for the Adaptive Experience Architecture docs repository.
# - coherence-guard (blocking): parse canonical xlsx and match docs counts (7/23+17/40).
# - traceability-guard (blocking, #323): evidence inventory + live issue/milestone/closure.
# - process-coherence-guard (blocking, #324): MR delivery evidence + named Process-Exception.
# - markdownlint (blocking, #325): pinned markdownlint-cli2, scoped published docs.
# - linkcheck (blocking, #326): pinned markdown-link-check, scoped published docs.
# - ruff (blocking, #327): pinned ruff, scoped scripts/platform/edge.
# - bandit (blocking, #328): pinned bandit, High findings fail, report retained.
# - python-lock (blocking, #329): committed platform/edge locks; regen no-diff.
# - pip-audit (blocking, #330): platform/edge locks, High/Critical fail, report retained.
# - image-digest (blocking, #331): runtime/base and material CI/Compose digest pins.

stages:
  - report
  - verify
  - integration
  - lint
  - deploy

coherence-guard:
  stage: verify
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
  script:
    - sh scripts/check-coherence.sh
  rules:
    - changes:
        - "docs/**/*"
        - "implementations/**/*"
        - "archive/**/*.xlsx"
        - "archive/**/*.csv"
        - "scripts/check-coherence.sh"
        - "scripts/check_coherence.py"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

