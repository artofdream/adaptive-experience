android-build-debug:
  stage: verify
  # 2024.01 is OpenJDK 17; the app compiles to Java 21. Unit tests then die
  # on UnsupportedClassVersionError. 2024.04 is the first cimg tag whose
  # default is OpenJDK 21. Do not target JDK 22+ — AGP 8.7 / D8 still cap
  # the Android toolchain at 21. Keep assemble and testDebugUnitTest in
  # this required job — do not allow_failure.
  image: cimg/android:2024.04@sha256:03abdefacd626f387ac523715ceee9a956dee9365683b958708427f3d6b51649
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  before_script:
    - cd clients/mobile/android
    - java -version
    # Play requires targetSdk 36 (#355). cimg/android:2024.04 may lack the
    # platform; install it explicitly. Stay on JDK 21 (AGP 8.7 / D8 cap).
    - |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platforms;android-36"
    # Protected file variable name: GOOGLE_SERVICES_JSON (sponsor pastes).
    # Never attach the live file as an artifact. Dummy example keeps assemble
    # compiling when the variable is still missing.
    - |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ -f "${GOOGLE_SERVICES_JSON}" ]; then
        cp "${GOOGLE_SERVICES_JSON}" app/google-services.json
      else
        cp app/google-services.json.example app/google-services.json
      fi
  script:
    # cimg/android runs as circleci; GitLab checkout is root-owned, so chmod +x
    # fails with Operation not permitted. Invoke via sh (file is 100644).
    - sh ./gradlew assembleDebug testDebugUnitTest
  artifacts:
    paths:
      - clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - clients/mobile/android/app/build/reports/tests/testDebugUnitTest/
    # Debug APK for UX sideload / emulator (#363 Phase A). Explicit path:
    # clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 14 days
  rules:
    - changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"

