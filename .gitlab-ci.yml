# Phase C (#364): Paparazzi Compose screenshots (Need/Pick/Pay). JVM — no
# emulator / Maestro (Maestro deferred as disproportionate for first MR).
# Manual + allow_failure so main stays green. Records PNGs as artifacts for
# UX review; does not gate MRs. Dual-probe website/operator stays out of CI
# (honesty #360). Play internal remains the store-install honesty gate.
android-compose-screenshots:
  stage: verify
  image: cimg/android:2024.04@sha256:03abdefacd626f387ac523715ceee9a956dee9365683b958708427f3d6b51649
  timeout: 45m
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  before_script:
    - cd clients/mobile/android
    - java -version
    - |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platforms;android-36"
    - |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ -f "${GOOGLE_SERVICES_JSON}" ]; then
        cp "${GOOGLE_SERVICES_JSON}" app/google-services.json
      else
        cp app/google-services.json.example app/google-services.json
      fi
  script:
    # Record (not verify) so first runs produce reviewable PNGs without
    # requiring committed goldens. Invoke via sh — cimg cannot chmod +x.
    - sh ./gradlew :app:recordPaparazziDebug
    - |
      echo "Paparazzi snapshots (review artifacts; not Play honesty):"
      find app/src/test/snapshots -type f -name '*.png' 2>/dev/null | head -50 || true
      find app/build/reports/paparazzi -type f 2>/dev/null | head -50 || true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - clients/mobile/android/app/src/test/snapshots/
      - clients/mobile/android/app/build/reports/paparazzi/
      - clients/mobile/android/app/build/reports/tests/testDebugUnitTest/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true

# Firebase App Distribution for UX testers (#363 Phase B). Not Play.
# FIREBASE_APP_DISTRIBUTION_CREDENTIALS — protected file variable (service
# account JSON). Never attach as artifact. Never commit.
# Optional: FIREBASE_APP_DISTRIBUTION_GROUPS (default ux-testers),
# FIREBASE_APP_DISTRIBUTION_RELEASE_NOTES.
# Gating: manual + allow_failure. Omitted when credentials var unset (honest,
# same pattern as android-bundle-release). First successful upload Unknown
# until sponsor pastes the file variable and runs the job.
android-app-distribution:
  stage: verify
  image: cimg/android:2024.04@sha256:03abdefacd626f387ac523715ceee9a956dee9365683b958708427f3d6b51649
  timeout: 45m
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  before_script:
    - cd clients/mobile/android
    - java -version
    - |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platforms;android-36"
    - |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ -f "${GOOGLE_SERVICES_JSON}" ]; then
        cp "${GOOGLE_SERVICES_JSON}" app/google-services.json
      else
        cp app/google-services.json.example app/google-services.json
      fi
    - |
      if [ -z "${FIREBASE_APP_DISTRIBUTION_CREDENTIALS:-}" ] || [ ! -f "${FIREBASE_APP_DISTRIBUTION_CREDENTIALS}" ]; then
        echo "SKIP: FIREBASE_APP_DISTRIBUTION_CREDENTIALS file variable is not available."
        echo "Protected file secrets are typically unset on unprotected branches."
        echo "Sponsor must add FIREBASE_APP_DISTRIBUTION_CREDENTIALS (service-account JSON file)"
        echo "and create Firebase App Distribution group ux-testers. Do not paste JSON in issues."
        echo "This is not an App Distribution upload."
        exit 1
      fi
      set +x
      CRED_OUT=/tmp/aea-fad-credentials.json
      cp "${FIREBASE_APP_DISTRIBUTION_CREDENTIALS}" "$CRED_OUT"
      chmod 600 "$CRED_OUT"
      export FIREBASE_APP_DISTRIBUTION_CREDENTIALS="$CRED_OUT"
      echo "ok: copied App Distribution credentials to job-local path (not an artifact)"
  script:
    - sh ./gradlew assembleDebug appDistributionUploadDebug
  artifacts:
    paths:
      - clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 14 days
    when: on_success
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $FIREBASE_APP_DISTRIBUTION_CREDENTIALS'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $FIREBASE_APP_DISTRIBUTION_CREDENTIALS'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web" && $FIREBASE_APP_DISTRIBUTION_CREDENTIALS'
      when: manual
      allow_failure: true

# Signed Play upload bundle for closed testing (#347). Not production.
# Artifact is the .aab only. Never attach the keystore or google-services.json.
# ANDROID_UPLOAD_KEYSTORE is a GitLab File variable whose value is **base64**
# of the upload JKS (#351). Do not paste raw keystore bytes into the textarea.
#   ANDROID_UPLOAD_KEYSTORE          file variable (base64 of JKS)
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD protected, masked variable
#   ANDROID_UPLOAD_KEY_ALIAS         protected variable (alias name only)
#   ANDROID_UPLOAD_KEY_PASSWORD      protected, masked variable
# Gating: manual + allow_failure. Script exits 1 (honest fail) when the
# keystore vars are absent. Protected CI variables are typically unavailable
# on unprotected MR source branches — this job is not an MR gate and must not
# turn MRs red. Do not expect it to run on every MR. Pipeline result of this
# job is Unknown until a run with sponsor-pasted secrets produces the .aab.
android-bundle-release:
  stage: verify
  image: cimg/android:2024.04@sha256:03abdefacd626f387ac523715ceee9a956dee9365683b958708427f3d6b51649
  timeout: 45m
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  before_script:
    - cd clients/mobile/android
    - java -version
    # Play requires targetSdk 36 (#355). cimg/android:2024.04 may lack the
    # platform; install it explicitly. Stay on JDK 21 (AGP 8.7 / D8 cap).
    - |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platforms;android-36"
    # Protected file variable name: GOOGLE_SERVICES_JSON (sponsor pastes).
    # Never attach the live file as an artifact. Dummy example keeps the
    # Google Services plugin compiling when the variable is still missing.
    - |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ -f "${GOOGLE_SERVICES_JSON}" ]; then
        cp "${GOOGLE_SERVICES_JSON}" app/google-services.json
      else
        cp app/google-services.json.example app/google-services.json
      fi
  script:
    - |
      if [ -z "${ANDROID_UPLOAD_KEYSTORE:-}" ] || [ ! -f "${ANDROID_UPLOAD_KEYSTORE}" ] \
        || [ -z "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:-}" ] \
        || [ -z "${ANDROID_UPLOAD_KEY_ALIAS:-}" ] \
        || [ -z "${ANDROID_UPLOAD_KEY_PASSWORD:-}" ]; then
        echo "SKIP: upload-keystore CI variables are not available in this pipeline."
        echo "Protected file/variable secrets are typically unset on unprotected branches."
        echo "Sponsor must add ANDROID_UPLOAD_KEYSTORE (file, base64 of JKS), ANDROID_UPLOAD_KEYSTORE_PASSWORD,"
        echo "ANDROID_UPLOAD_KEY_ALIAS, and ANDROID_UPLOAD_KEY_PASSWORD in GitLab CI/CD settings."
        echo "Do not paste those values in issues. This is not a signed .aab."
        exit 1
      fi
      set +x
      KS_OUT=/tmp/aea-upload-keystore.jks
      rm -f "$KS_OUT"
      if ! tr -d '\n\r\t ' < "${ANDROID_UPLOAD_KEYSTORE}" | base64 -d > "$KS_OUT" || [ ! -s "$KS_OUT" ]; then
        echo "FAIL: ANDROID_UPLOAD_KEYSTORE did not decode as base64 to a non-empty keystore."
        echo "Re-paste the File variable as base64 of the JKS. Do not paste raw keystore bytes."
        echo "Do not print the file. This is not a signed .aab."
        exit 1
      fi
      echo "ok: decoded ANDROID_UPLOAD_KEYSTORE to job-local keystore (not an artifact)"
      export ANDROID_UPLOAD_KEYSTORE="$KS_OUT"
      sh ./gradlew bundleRelease
    - test -f app/build/outputs/bundle/release/app-release.aab
  artifacts:
    paths:
      - clients/mobile/android/app/build/outputs/bundle/release/app-release.aab
    expire_in: 14 days
    when: on_success
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ANDROID_UPLOAD_KEYSTORE'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $ANDROID_UPLOAD_KEYSTORE'
      changes:
        - "clients/mobile/android/**/*"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web" && $ANDROID_UPLOAD_KEYSTORE'
      when: manual
      allow_failure: true

# Play internal/closed testing upload via Android Publisher API (#354).
# Not Production. Manual + allow_failure. Not an MR gate.
# PLAY_API_SERVICE_ACCOUNT_JSON — protected File variable (service-account JSON).
# Never attach as artifact. Never commit. Never paste in issues/MRs/chat.
# Optional: PLAY_TRACK (default internal; closed testing may be alpha or a
# custom Console track name — confirm in Play Console; never production),
# PLAY_RELEASE_STATUS (default completed), PLAY_PACKAGE_NAME.
# Prefer artifact from android-bundle-release; rebuilds signed bundle when the
# AAB is missing but ANDROID_UPLOAD_* vars are present (same honesty as
# android-bundle-release / App Distribution).
# versionCode must be bumped in app/build.gradle.kts or Play rejects the edit.
android-play-internal-upload:
  stage: verify
  image: cimg/android:2024.04@sha256:03abdefacd626f387ac523715ceee9a956dee9365683b958708427f3d6b51649
  timeout: 45m
  needs:
    - job: android-bundle-release
      optional: true
      artifacts: true
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    PLAY_TRACK: "internal"
    PLAY_PACKAGE_NAME: "link.artof.aea.companion"
  before_script:
    - cd clients/mobile/android
    - java -version
    - |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platforms;android-36"
    - |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ -f "${GOOGLE_SERVICES_JSON}" ]; then
        cp "${GOOGLE_SERVICES_JSON}" app/google-services.json
      else
        cp app/google-services.json.example app/google-services.json
      fi
    - |
      # Presence check only — defer copy/export until after unit tests so
      # missing-credentials cases are not polluted by the job-local SA path
      # (and GitLab File var path is unset around the unittest invocation).
      if [ -z "${PLAY_API_SERVICE_ACCOUNT_JSON:-}" ] || [ ! -f "${PLAY_API_SERVICE_ACCOUNT_JSON}" ]; then
        echo "SKIP: PLAY_API_SERVICE_ACCOUNT_JSON file variable is not available."
        echo "Protected file secrets are typically unset on unprotected branches."
        echo "Sponsor must add PLAY_API_SERVICE_ACCOUNT_JSON (Play API service-account JSON,"
        echo "Type File, Protected) and grant the SA on the Play Console app (internal/closed"
        echo "track only — not Production). Do not paste JSON in issues/MRs/chat."
        echo "This is not a Play upload."
        exit 1
      fi
      export _AEA_PLAY_SA_SRC="${PLAY_API_SERVICE_ACCOUNT_JSON}"
      echo "ok: Play API credentials file variable present (copy deferred until after unit tests)"
  script:
    - cd ../../..
    - |
      # Offline unit tests before SA copy/export and before PLAY_AAB_PATH export.
      # Belt-and-suspenders with test setUp env isolation (#354 / job 16265846106).
      env -u PLAY_API_SERVICE_ACCOUNT_JSON -u PLAY_AAB_PATH \
        python3 scripts/test_upload_play_aab.py -v
    - cd clients/mobile/android
    - |
      set -e
      AAB="app/build/outputs/bundle/release/app-release.aab"
      if [ ! -f "$AAB" ]; then
        echo "info: no android-bundle-release artifact AAB; attempting rebuild"
        if [ -z "${ANDROID_UPLOAD_KEYSTORE:-}" ] || [ ! -f "${ANDROID_UPLOAD_KEYSTORE}" ] \
          || [ -z "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:-}" ] \
          || [ -z "${ANDROID_UPLOAD_KEY_ALIAS:-}" ] \
          || [ -z "${ANDROID_UPLOAD_KEY_PASSWORD:-}" ]; then
          echo "SKIP: app-release.aab missing and upload-keystore CI variables unavailable."
          echo "Run android-bundle-release first, or ensure ANDROID_UPLOAD_* vars are set."
          echo "This is not a Play upload."
          exit 1
        fi
        set +x
        KS_OUT=/tmp/aea-upload-keystore.jks
        rm -f "$KS_OUT"
        if ! tr -d '\n\r\t ' < "${ANDROID_UPLOAD_KEYSTORE}" | base64 -d > "$KS_OUT" || [ ! -s "$KS_OUT" ]; then
          echo "FAIL: ANDROID_UPLOAD_KEYSTORE did not decode as base64 to a non-empty keystore."
          echo "This is not a Play upload."
          exit 1
        fi
        export ANDROID_UPLOAD_KEYSTORE="$KS_OUT"
        echo "ok: decoded ANDROID_UPLOAD_KEYSTORE for rebuild (not an artifact)"
        sh ./gradlew bundleRelease
      fi
      test -f "$AAB"
      export PLAY_AAB_PATH="$(pwd)/$AAB"
    - cd ../../..
    - |
      # cimg/android:2024.04 has python3 without pip (job 16263370404).
      if ! python3 -m pip --version >/dev/null 2>&1; then
        if python3 -m ensurepip --upgrade >/dev/null 2>&1; then
          echo "ok: bootstrapped pip via ensurepip"
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          echo "ok: installed python3-pip via apt"
        fi
      fi
      python3 -m pip --version
    - python3 -m pip install --user --quiet 'google-api-python-client>=2.100.0' 'google-auth>=2.23.0'
    - |
      set +x
      CRED_OUT=/tmp/aea-play-api-sa.json
      cp "${_AEA_PLAY_SA_SRC}" "$CRED_OUT"
      chmod 600 "$CRED_OUT"
      export PLAY_API_SERVICE_ACCOUNT_JSON="$CRED_OUT"
      echo "ok: copied Play API credentials to job-local path (not an artifact)"
    - python3 scripts/upload_play_aab.py --json-out play-upload-report.json
  artifacts:
    when: always
    paths:
      - play-upload-report.json
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $PLAY_API_SERVICE_ACCOUNT_JSON'
      changes:
        - "clients/mobile/android/**/*"
        - "scripts/upload_play_aab.py"
        - "scripts/test_upload_play_aab.py"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $PLAY_API_SERVICE_ACCOUNT_JSON'
      changes:
        - "clients/mobile/android/**/*"
        - "scripts/upload_play_aab.py"
        - "scripts/test_upload_play_aab.py"
        - ".gitlab-ci.yml"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web" && $PLAY_API_SERVICE_ACCOUNT_JSON'
      when: manual
      allow_failure: true

platform-foundation-integration:
