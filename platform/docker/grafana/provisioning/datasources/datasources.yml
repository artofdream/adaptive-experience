apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://agent-runner.aea-pilot.internal:8080
    isDefault: true
    jsonData:
      httpMethod: GET
      timeInterval: 15s

  - name: CloudWatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-east-1
