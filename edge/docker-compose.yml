name: adaptive-experience-edge

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: adaptive_experience
      POSTGRES_USER: aea_migration
      POSTGRES_PASSWORD: local-migration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aea_migration -d adaptive_experience"]
      interval: 3s
      timeout: 3s
      retries: 20

  orchestration:
    build:
      context: ..
      dockerfile: platform/Dockerfile.orchestration
    environment:
      AEA_POSTGRES_DSN: postgresql://aea_migration:local-migration-only@postgres:5432/adaptive_experience
      AEA_ORCHESTRATION_TOKEN: local-internal-token
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python platform/scripts/apply_migrations.py && uvicorn aea_platform.internal_runtime:app --host 0.0.0.0 --port 8081 --no-server-header"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://localhost:8081/internal/v1/sessions/00000000-0000-0000-0000-000000000000', method='PUT', headers={'Authorization':'Bearer local-internal-token','X-Subject-Reference':'health'}); urllib.request.urlopen(r)"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory-seeder:
    build:
      context: ..
      dockerfile: platform/Dockerfile.orchestration
    environment:
      AEA_POSTGRES_DSN: postgresql://aea_migration:local-migration-only@postgres:5432/adaptive_experience
      AEA_ENVIRONMENT: local
      AEA_SEED_INVENTORY: "1"
      AEA_SEED_INVENTORY_INTERVAL_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      orchestration:
        condition: service_healthy
    command: ["python", "platform/scripts/seed_local_inventory.py", "--loop"]
    healthcheck:
      test: ["CMD", "python", "platform/scripts/seed_local_inventory.py", "--check"]
      interval: 3s
      timeout: 3s
      retries: 20

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    environment:
      AEA_ENVIRONMENT: local
      AEA_FLORIST_OPERATOR: "1"
      AEA_ALLOWED_ORIGIN: https://localhost:8443
      AEA_LOCAL_BEARER_TOKEN: local-browser-token
      AEA_ORCHESTRATION_URL: http://orchestration:8081
      AEA_ORCHESTRATION_TOKEN: local-internal-token
    depends_on:
      orchestration:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    expose:
      - "8080"

  gateway:
    build:
      context: gateway
    environment:
      AEA_GRAFANA_UPSTREAM: http://grafana:3000
    depends_on:
      bff:
        condition: service_healthy
      inventory-seeder:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1:8443/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8443:8443"

  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../platform/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

