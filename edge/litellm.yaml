# Local-only LiteLLM proxy for OpenAICompatibleIntentInterpreter.
# Path B Terraform embeds this file into the LiteLLM task (infra/aws/ecs.tf).
# AEA_AI_MODEL must match a model_name below. Override via compose interpolation.
model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 2.5
  num_retries: 0

# Path B has no Prisma. Master-key-only in the VPC. Rolling ghcr.io/berriai/litellm:main-latest
# returns HTTP 400 {"type":"no_db_connection","message":"No connected db."} when a
# chat-completions bearer is not treated as the master key, so T-01 degrades even while
# the ECS task is HEALTHY. Pin the master key and allow VPC traffic if DB is absent.
# Closes GitLab #265 (runtime: service up, POST /v1/chat/completions 400).
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_requests_on_db_unavailable: true
