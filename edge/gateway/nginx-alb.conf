events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_x_aea_loadtest_token $limit_key {
    "aea-authorized-loadtest-passkey-2026" "";
    default $binary_remote_addr;
  }
  limit_req_zone $limit_key zone=edge:10m rate=20r/s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  server_tokens off;
  resolver __RESOLVER__ valid=10s ipv6=off;
  server {
    listen 8080;
    port_in_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    location = / {
      try_files /index.html =404;
    }
    location = /florist {
      try_files /florist.html =404;
    }
    location /assets/ {
      try_files $uri =404;
    }
    location /api/ {
      limit_req zone=edge burst=40 nodelay;
      set $bff_upstream __BFF_UPSTREAM__;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_pass $bff_upstream;
      proxy_buffering off;
    }
    location /florist/livechat {
      limit_req zone=edge burst=40 nodelay;
      set $bff_upstream __BFF_UPSTREAM__;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass $bff_upstream;
      proxy_buffering off;
    }
    location = /healthz {
      limit_req zone=edge burst=40 nodelay;
      set $bff_upstream __BFF_UPSTREAM__;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_pass $bff_upstream;
      proxy_buffering off;
    }
    location /webhooks/ {
      limit_req zone=edge burst=40 nodelay;
      set $agent_upstream __AGENT_UPSTREAM__;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_pass $agent_upstream;
      proxy_buffering off;
    }
    location /cloud/ {
      limit_req zone=edge burst=40 nodelay;
      set $agent_upstream __AGENT_UPSTREAM__;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_pass $agent_upstream;
      proxy_buffering off;
    }
    location = /metrics {
      limit_req zone=edge burst=40 nodelay;
      set $agent_upstream __AGENT_UPSTREAM__;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_pass $agent_upstream;
      proxy_buffering off;
    }
    location = /grafana {
      return 301 /grafana/;
    }
    location /grafana/ {
      limit_req zone=edge burst=40 nodelay;
      set $grafana_upstream __GRAFANA_UPSTREAM__;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_hide_header Content-Security-Policy;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Grafana-Org-Id' always;
      rewrite ^/grafana/(.*)$ /grafana/$1 break;
      proxy_pass $grafana_upstream;
      proxy_buffering off;
    }
  }
}

