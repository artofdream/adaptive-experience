events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8443 ssl;
    root /usr/share/nginx/html;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = / {
      try_files /index.html =404;
    }
    location = /florist {
      try_files /florist.html =404;
    }
    location /assets/ {
      try_files $uri =404;
    }
    location /api/ {
      limit_req zone=edge burst=40 nodelay;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_pass http://bff:8080;
      proxy_buffering off;
    }
    location = /healthz {
      limit_req zone=edge burst=40 nodelay;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_pass http://bff:8080;
      proxy_buffering off;
    }
    location /webhooks/ {
      limit_req zone=edge burst=40 nodelay;
      set $agent_upstream http://agent-runner:8080;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_pass $agent_upstream;
      proxy_buffering off;
    }
    location /cloud/ {
      limit_req zone=edge burst=40 nodelay;
      set $agent_upstream http://agent-runner:8080;
      proxy_set_header X-Internal-Identity "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_pass $agent_upstream;
      proxy_buffering off;
    }
  }
}
