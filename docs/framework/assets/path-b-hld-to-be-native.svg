  <text x="640" y="38" fill="#e7e4dc" font-family="Palatino, Times New Roman, serif" font-size="26" font-weight="bold" text-anchor="middle">AEA framework HLD — Path B to-be (native included)</text>
  <text x="640" y="62" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">TO-BE — intended architecture, not a live probe</text>
  <text x="640" y="84" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Same TLS edge, BFF, bus, domain services, and PostgreSQL. Native is another client of that BFF, not a second shop.</text>

  <rect x="40" y="106" width="380" height="148" rx="8" fill="#181c22" stroke="#383e47"/>
  <text x="230" y="132" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.4">PUBLIC FRAMEWORK SURFACE</text>
  <text x="230" y="158" fill="#e7e4dc" font-family="ui-monospace, monospace" font-size="15" font-weight="bold" text-anchor="middle">architecture.artof.link</text>
  <text x="60" y="186" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Unchanged. GitLab Pages, not the shop.</text>
  <text x="60" y="208" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Native does not publish here.</text>
  <text x="60" y="230" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Probe 29 Aug 2026: GET / → 200</text>

  <rect x="450" y="106" width="790" height="148" rx="8" fill="#181c22" stroke="#c4b08a" stroke-width="1.5"/>
