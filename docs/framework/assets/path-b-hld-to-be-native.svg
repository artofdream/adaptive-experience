  <text x="845" y="158" fill="#e7e4dc" font-family="ui-monospace, monospace" font-size="15" font-weight="bold" text-anchor="middle">aea.artof.link</text>
  <text x="470" y="186" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Browser workspace stays. Android companion is intended as another client of the same BFF.</text>
  <text x="470" y="208" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Sideload first. Play Store is out of Phase 0. Companion telemetry is not this florist stack.</text>
  <text x="470" y="230" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Not verified as a live shop client. Domain services still decide.</text>

