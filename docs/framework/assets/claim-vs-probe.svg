<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" rx="8" fill="#121417"/>
  <rect x="1" y="1" width="798" height="478" rx="7" fill="none" stroke="#2a2e33" stroke-width="1.5"/>
  <text x="400" y="65" fill="#e7e4dc" font-family="Palatino, Times New Roman, serif" font-size="34" font-weight="bold" text-anchor="middle">Claim vs probe</text>
  
  <g transform="translate(100, 130)">
    <rect width="240" height="150" rx="6" fill="#181c22" stroke="#383e47" stroke-width="1.5"/>
    <text x="120" y="50" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">A MERGED TICKET</text>
    <rect x="30" y="70" width="180" height="48" rx="4" fill="#221818" stroke="#d4a07a" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="120" y="102" fill="#d4a07a" font-family="ui-monospace, monospace" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="3">VERIFIED</text>
    <line x1="25" y1="65" x2="215" y2="123" stroke="#b85c1c" stroke-width="3"/>
    <line x1="25" y1="123" x2="215" y2="65" stroke="#b85c1c" stroke-width="3"/>
    <text x="120" y="185" fill="#9a9588" font-family="Palatino, serif" font-style="italic" font-size="16" text-anchor="middle">Status words are claims</text>
  </g>
  
  <g transform="translate(365, 195)">
    <line x1="0" y1="10" x2="65" y2="10" stroke="#c4b08a" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="65,4 77,10 65,16" fill="#c4b08a"/>
    <text x="35" y="-5" fill="#c4b08a" font-family="Palatino, serif" font-style="italic" font-size="13" text-anchor="middle">or write Unknown</text>
  </g>
  
  <g transform="translate(460, 130)">
    <rect width="240" height="150" rx="6" fill="#181c22" stroke="#c4b08a" stroke-width="1.5"/>
    <text x="120" y="40" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">DUAL-VIEWPORT PROBE</text>
    
    <rect x="40" y="60" width="36" height="60" rx="4" fill="none" stroke="#e7e4dc" stroke-width="1.5"/>
    <circle cx="58" cy="112" r="2" fill="#9a9588"/>
    
    <rect x="95" y="60" width="105" height="55" rx="3" fill="none" stroke="#e7e4dc" stroke-width="1.5"/>
    <line x1="147" y1="115" x2="147" y2="125" stroke="#e7e4dc" stroke-width="2"/>
    <line x1="130" y1="125" x2="165" y2="125" stroke="#e7e4dc" stroke-width="2"/>
    <path d="M 140 85 L 145 92 L 160 75" fill="none" stroke="#c4b08a" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="120" y="185" fill="#e7e4dc" font-family="Palatino, serif" font-size="16" text-anchor="middle">The same journey, both viewports</text>
  </g>
  
  <line x1="150" y1="390" x2="310" y2="390" stroke="#2a2e33" stroke-width="1"/>
  <polygon points="400,385 405,390 400,395 395,390" fill="#c4b08a"/>
  <line x1="490" y1="390" x2="650" y2="390" stroke="#2a2e33" stroke-width="1"/>
  <text x="400" y="425" fill="#c4b08a" font-family="Palatino, serif" font-size="17" text-anchor="middle">Closing a tracker is not a clip.</text>
</svg>
