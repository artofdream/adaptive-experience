  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e7e4dc" text-anchor="middle">
    <rect x="64" y="576" width="148" height="52" rx="5" fill="#1e232b" stroke="#2a2e33"/><text x="138" y="608">Catalog</text>
