  <polygon points="772,402 764,398 764,406" fill="#c4b08a"/>

  <rect x="1036" y="348" width="204" height="108" rx="8" fill="#181c22" stroke="#c4b08a"/>
  <text x="1138" y="384" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CONTRACT BUS</text>
  <text x="1138" y="410" fill="#e7e4dc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Kafka-compatible</text>
  <text x="1138" y="430" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">Not browser-reachable</text>

  <line x1="1008" y1="402" x2="1036" y2="402" stroke="#c4b08a" stroke-width="1.5"/>
  <polygon points="1036,402 1028,398 1028,406" fill="#c4b08a"/>

