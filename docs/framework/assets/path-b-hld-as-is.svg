<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="100%" height="100%">
  <rect width="1280" height="980" rx="8" fill="#121417"/>
  <rect x="1" y="1" width="1278" height="978" rx="7" fill="none" stroke="#2a2e33" stroke-width="1.5"/>
  <text x="640" y="42" fill="#e7e4dc" font-family="Palatino, Times New Roman, serif" font-size="28" font-weight="bold" text-anchor="middle">AEA framework HLD — Path B as-is</text>
  <text x="640" y="68" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">Adaptive Experience = Shared Understanding + Domain Services + Outer Harness</text>
  <text x="640" y="90" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Lily's Florist at aea.artof.link is the live instantiation. architecture.artof.link is the framework site. They do not share a load balancer.</text>

  <rect x="40" y="112" width="380" height="168" rx="8" fill="#181c22" stroke="#c4b08a" stroke-width="1.5"/>
  <text x="230" y="138" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.4">PUBLIC FRAMEWORK SURFACE</text>
  <text x="230" y="164" fill="#e7e4dc" font-family="ui-monospace, monospace" font-size="15" font-weight="bold" text-anchor="middle">architecture.artof.link</text>
  <text x="60" y="192" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Allowlisted markdown on GitLab main</text>
  <text x="60" y="214" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">GitLab Pages · DNS alias · HTTPS · no CMS</text>
  <text x="60" y="236" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Not the shop · merge publishes</text>
  <text x="60" y="258" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Probe 29 Aug 2026: GET / → 200</text>

  <rect x="450" y="112" width="790" height="168" rx="8" fill="#181c22" stroke="#c4b08a" stroke-width="1.5"/>
  <text x="845" y="138" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.4">PATH B RUNTIME — LILY'S FLORIST</text>
  <text x="845" y="164" fill="#e7e4dc" font-family="ui-monospace, monospace" font-size="15" font-weight="bold" text-anchor="middle">aea.artof.link</text>
  <text x="470" y="192" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Reference cloud: AWS us-east-1 (committed Terraform). Laptop path: Docker Compose, same split, not this site.</text>
  <text x="470" y="214" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">J1 Urgent Sam · J2 Planner Sarah · J3 Loyal Alex · J4 Tracker Chris — phone tapes 27 Aug 2026, not a dual-viewport probe</text>
  <text x="470" y="236" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">AI may interpret. Domain services decide. Browser never talks to the database or the bus.</text>
  <text x="470" y="258" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Probe 29 Aug 2026: GET / → 200. That is not dual-viewport and not payment.</text>

