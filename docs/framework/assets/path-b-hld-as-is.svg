  <rect x="40" y="748" width="1200" height="88" rx="8" fill="#181c22" stroke="#383e47"/>
  <text x="640" y="776" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.4">OUTER HARNESS  ·  SIX LAYERS, NOT EXTRA PRODUCTS</text>
  <text x="640" y="804" fill="#e7e4dc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Guides  ·  Sensors  ·  Loop (interpret · act · verify · remember)  ·  Memory  ·  Permissions  ·  Observability</text>
  <text x="640" y="824" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Hats are roles, not layers. Three jobs: implement, verify, merge.</text>

  <rect x="40" y="856" width="1200" height="96" rx="8" fill="#16191e" stroke="#2a2e33"/>
  <text x="640" y="882" fill="#c4b08a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.4">HONESTY</text>
  <text x="640" y="906" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Payment is still a mockup. Dual-viewport after CSS remains Unknown. Native mobile is a later client, not this stack. 3DX Lab is out of this picture.</text>
  <text x="640" y="928" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Source: public /stack and /schema on architecture.artof.link (committed GitLab main). Internal runbooks not dumped. No invented ALB, ECS, or broker names.</text>
