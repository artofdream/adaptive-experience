  <rect x="484" y="348" width="240" height="52" rx="5" fill="#1e232b" stroke="#2a2e33"/>
  <text x="604" y="370" fill="#e7e4dc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Backend-for-frontend</text>
  <text x="604" y="388" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">Experience tiles · one session</text>
  <rect x="484" y="412" width="240" height="68" rx="5" fill="#1e232b" stroke="#2a2e33"/>
  <text x="604" y="436" fill="#e7e4dc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Session memory (agreed state)</text>
  <text x="604" y="456" fill="#9a9588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">Reviewable · not invented intent</text>

